<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LastCall Socket.io Test</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    #log { background: #1e1e1e; color: #0f0; padding: 20px; border-radius: 8px; height: 400px; overflow-y: scroll; font-family: monospace; }
    .event { margin: 5px 0; padding: 8px; border-left: 3px solid #0f0; padding-left: 12px; }
    input, button { padding: 10px; margin: 5px; font-size: 14px; }
    h1 { color: #333; }
  </style>
</head>
<body>
  <h1>🔔 LastCall Real-Time Test</h1>
  <p>Enter an auction ID to watch live events:</p>
  <input type="text" id="auctionId" placeholder="Paste auction ID here" style="width: 300px;" />
  <button onclick="joinRoom()">Join Auction Room</button>
  
  <h3>Event Log:</h3>
  <div id="log"></div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io("http://localhost:3000");
    const log = document.getElementById("log");

    function addLog(message, type = "info") {
      const div = document.createElement("div");
      div.className = "event";
      div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      div.style.borderLeftColor = type === "bid" ? "#0f0" : type === "win" ? "#ff0" : "#0af";
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    socket.on("connect", () => {
      addLog("✅ Connected to LastCall server!", "info");
    });

    socket.on("newBid", (data) => {
      addLog(`💰 NEW BID: ${data.bidderName} bid $${data.currentBid}`, "bid");
    });

    socket.on("outbid", (data) => {
      addLog(`⚠️ OUTBID: ${data.message}`, "win");
    });

    socket.on("auctionEnded", (data) => {
      addLog(`🏆 AUCTION ENDED: ${data.message || "Status: " + data.status}`, "win");
    });

    function joinRoom() {
      const auctionId = document.getElementById("auctionId").value.trim();
      if (!auctionId) {
        alert("Please enter an auction ID!");
        return;
      }
      socket.emit("joinAuction", auctionId);
      addLog(`👀 Joined room for auction: ${auctionId}`, "info");
    }
  </script>
</body>
</html>
